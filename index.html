<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>บัญชีขายขี้ยาง</title>
<style>
*{box-sizing:border-box;font-family:sans-serif}
html,body{margin:0;padding:0;width:100%;max-width:100vw;overflow-x:hidden;background:#f0f4f1;font-size:16px}
body{padding:8px}
.box{width:100%;max-width:550px;margin:0 auto 12px;background:#fff;padding:12px;border-radius:12px;box-shadow:0 2px 8px #0001;overflow-x:hidden}
h2{margin:0 0 10px;color:#1b5e20;font-size:20px;text-align:center}
label{display:block;font-weight:bold;margin:10px 0 4px}
input,select,textarea{width:100%;max-width:100%;min-width:0;display:block;padding:10px;font-size:18px;font-weight:bold;border:2px solid #64b5f6;border-radius:8px;background:#e3f2fd;color:#0d47a1;-webkit-appearance:none;appearance:none}
input[type="date"]{min-height:46px}
.yel{background:#fff8e1;border-color:#ffb300;color:#e65100}
.g2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:6px}
.g2>div{min-width:0}
button{width:100%;max-width:100%;padding:10px 6px;font-size:15px;font-weight:bold;border:0;border-radius:8px;color:#fff;margin-top:8px;cursor:pointer}
.bg{background:#2e7d32}.bb{background:#1565c0}.bo{background:#ef6c00}.br{background:#c62828}.bk{background:#455a64}
.bm{background:#fff;color:#1b5e20;border:2px solid #1b5e20;margin-top:0}
.bm.act{background:#1b5e20;color:#fff}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 0;border-bottom:1px dashed #ccc}
.big{font-size:22px;color:#1b5e20;font-weight:bold}
table{width:100%;border-collapse:collapse;font-size:12px;margin-top:8px}
th,td{border:1px solid #ccc;padding:4px 3px;text-align:right;word-break:break-word}
th{background:#e8f5e9;text-align:center}
.w-card{border:1px solid #ddd;padding:10px;border-radius:8px;margin-bottom:10px;background:#fafafa}
.w-top{display:grid;grid-template-columns:minmax(0,1fr) 70px;gap:6px;margin-bottom:6px}
.click-row{cursor:pointer}.click-row:active{background:#e3f2fd}
.detail-box{margin-top:12px;padding:8px;background:#f9fbe7;border:2px solid #c0ca33;border-radius:8px;overflow-x:auto;max-width:100%}
.act-sm{width:auto;margin:0;padding:4px 6px;font-size:11px}
.edit-banner{background:#fff3e0;border:2px solid #ff9800;color:#e65100;padding:10px;border-radius:8px;margin-bottom:12px;font-weight:bold;text-align:center}
.top-bar{display:flex;gap:6px;align-items:center;margin-bottom:8px;min-width:0}
.sync-bar{flex:1;min-width:0;text-align:center;font-size:12px;padding:6px 4px;border-radius:6px;background:#e8f5e9;color:#1b5e20;font-weight:bold;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lock-btn{width:auto;flex-shrink:0;margin:0;padding:6px 10px;font-size:13px;background:#455a64}
.plot-bar{display:flex;align-items:center;gap:8px;background:#e8f5e9;border:2px solid #2e7d32;padding:6px 10px;border-radius:8px;margin-bottom:8px}
.plot-bar span{font-weight:bold;color:#1b5e20;white-space:nowrap;font-size:15px}
.plot-bar select{padding:6px 8px;font-size:16px;border:1px solid #2e7d32;background:#fff;color:#1b5e20}
.login-box{width:100%;max-width:400px;margin:40px auto;background:#fff;padding:24px 16px;border-radius:14px;box-shadow:0 4px 14px #0002;text-align:center}
.pin-inp{text-align:center;font-size:26px;letter-spacing:6px;margin:14px 0}
.chk-row{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid #ccc;border-radius:8px;margin-bottom:8px;background:#fafafa;cursor:pointer}
.chk-row input{width:22px;height:22px;margin:0;-webkit-appearance:checkbox;appearance:checkbox;flex-shrink:0}
.slip-pair{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;margin-bottom:18px}
.slip-portrait{display:block;margin-bottom:18px;overflow-x:auto;max-width:100%}
@media(max-width:520px){.slip-pair{grid-template-columns:1fr}}
.slip-card{border:1px solid #bbb;background:#fff;color:#111;font-size:15px;display:flex;flex-direction:column}
.slip-hdr{background:#1b4d2e;color:#fff;text-align:center;font-size:20px;font-weight:bold;padding:12px 8px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.slip-body{padding:14px 16px;flex:1;display:flex;flex-direction:column}
.slip-plot{text-align:center;font-size:14px;color:#1b5e20;font-weight:bold;margin-bottom:2px}
.slip-sub{text-align:center;font-size:15px;color:#333;margin-bottom:10px;font-weight:bold}
.slip-name{font-size:21px;font-weight:bold;margin-bottom:12px}
.slip-line{display:flex;justify-content:space-between;padding:5px 0;font-size:15px}
.slip-net{font-weight:bold;font-size:16px;padding-top:8px}
.slip-note{border:1px solid #999;min-height:110px;flex:1;padding:8px;margin-top:12px;font-size:14px;color:#444}
.sum-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px;margin-bottom:12px}
.sum-box{border:1px solid #a5d6a7;background:#f1f8e9;padding:8px 10px;border-radius:8px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.sum-box span{display:block;font-size:12px;color:#33691e}
.sum-box b{display:block;font-size:16px;color:#1b5e20;margin-top:2px}
.sum-box.hi{background:#fff8e1;border-color:#ffcc80}
.sum-box.hi span{color:#e65100}.sum-box.hi b{color:#bf360c}
.sum-tbl{width:100%;border-collapse:collapse;font-size:12px;margin-top:6px}
.sum-tbl th,.sum-tbl td{border:1px solid #888;padding:5px 3px}
.sum-tbl th{background:#1b4d2e;color:#fff;text-align:center;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.admin-box{margin-top:14px;padding:10px;background:#eceff1;border:2px solid #90a4ae;border-radius:10px}
.admin-sec{background:#fff;padding:10px;border-radius:8px;border:1px solid #cfd8dc;margin-bottom:10px}
.admin-sec h3{margin:0 0 8px;font-size:16px;color:#263238}
.log-list{max-height:220px;overflow-y:auto;border:1px solid #cfd8dc;border-radius:6px;padding:6px;background:#fafafa;font-size:12px}
.log-item{padding:6px 4px;border-bottom:1px dashed #cfd8dc;line-height:1.4}
.log-item:last-child{border-bottom:0}
.log-time{color:#546e7a;font-size:11px;display:block}
.hide{display:none!important}
@page{size:A4 portrait;margin:0}
@media print{
  html,body{width:210mm;max-width:none;overflow:visible;background:#fff!important;margin:0!important;padding:0!important}
  .no-print{display:none!important}
  #appMain,#p6{display:block!important;max-width:none!important;width:210mm!important;margin:0!important;padding:0!important;box-shadow:none!important;border-radius:0!important;background:#fff!important}
  .slip-page{width:210mm;height:274mm;padding:6mm;display:flex!important;align-items:center;justify-content:center;page-break-after:always;break-after:page;overflow:hidden;box-sizing:border-box}
  .slip-page:last-child{page-break-after:auto;break-after:auto}
  .slip-pair{display:grid!important;grid-template-columns:1fr 1fr!important;gap:10mm;width:260mm;height:186mm;flex-shrink:0;margin:0;transform:rotate(90deg);transform-origin:center center}
  .slip-portrait{display:block!important;width:194mm;height:260mm;margin:0;overflow:visible}
  .slip-portrait .slip-hdr{font-size:22px;padding:12px}
  .slip-portrait .slip-sub{font-size:16px;margin-bottom:10px}
  .slip-portrait .sum-grid{gap:10px;margin-bottom:12px}
  .slip-portrait .sum-box{padding:9px 12px}
  .slip-portrait .sum-box span{font-size:13px}
  .slip-portrait .sum-box b{font-size:19px}
  .slip-portrait .sum-tbl{font-size:13px}
  .slip-portrait .sum-tbl th,.slip-portrait .sum-tbl td{padding:7px 5px}
  .slip-card{width:100%;height:100%}
}
</style>
</head>
<body>
<div id="loginBox" class="login-box no-print">
  <h2 style="font-size:24px">🔒 บัญชีขายขี้ยาง</h2>
  <p style="color:#555;font-size:15px;margin:6px 0">
    กรุณาใส่รหัสผ่านเพื่อเข้าใช้งาน</p>
  <input type="password" inputmode="numeric"
    id="pinInp" class="pin-inp" placeholder="••••"
    onkeyup="if(event.key==='Enter')checkPin()">
  <button type="button" id="btnLogin" class="bg"
    style="font-size:18px;padding:13px"
    onclick="checkPin()">🔓 เข้าใช้งาน</button>
  <p id="pinErr" style="color:#c62828;font-size:15px;
    font-weight:bold;margin-top:10px" class="hide">
    ❌ รหัสผ่านไม่ถูกต้อง กรุณาลองใหม่</p>
  <button type="button" id="btnAdminUnlock" class="bo hide"
    style="font-size:14px;padding:10px;margin-top:12px"
    onclick="adminUnlockPin()">🔑 ปลดล็อกฉุกเฉิน (สำหรับแอดมิน)</button>
</div>
<script>
const $=id=>document.getElementById(id);
const ls=localStorage;
const FB_URL="https://seeview-rubber-default-rtdb"
  +".asia-southeast1.firebasedatabase.app"
  +"/rubberData.json";
const DEF_APP_HASH=
  "03ac674216f3e15c761ee1a5e255f067"
  +"953623c8b388b4459e13f978d7c846f4";
const DEF_ADM_HASH=
  "27a27820be4e058b0156a6f7f83f6236"
  +"a6042243683f894f6322b3e3009a6443";

let APP_VER=ls.getItem('rbAppVer')||'v1';
let pendingVer="",isReloading=false;
let APP_HASH=ls.getItem('rbAppHash')||DEF_APP_HASH;
let ADMIN_HASH=ls.getItem('rbAdmHash')||DEF_ADM_HASH;
let ACT_LOGS=JSON.parse(ls.getItem('rbActLogs')||'[]');
let DEVICES=JSON.parse(ls.getItem('rbDevices')||'{}');
let DEV_ID=ls.getItem('rbDevId');
if(!DEV_ID){
  DEV_ID='dev_'+Date.now()+'_'+Math.floor(Math.random()*1000);
  ls.setItem('rbDevId',DEV_ID);
}
const normPin=s=>String(s||"").trim()
  .replace(/[๐-๙]/g,c=>"๐๑๒๓๔๕๖๗๘๙".indexOf(c));
const isSha256=s=>/^[a-f0-9]{64}$/i.test(String(s||""));

async function hashPin(pin){
  let clean=normPin(pin);
  if(isSha256(clean))return clean.toLowerCase();
  if(!window.crypto||!crypto.subtle){
    let h=0;
    for(let i=0;i<clean.length;i++)
      h=((h<<5)-h)+clean.charCodeAt(i)|0;
    return 'fallback_'+h;
  }
  try{
    const buf=await crypto.subtle.digest(
      'SHA-256',new TextEncoder().encode(clean)
    );
    return Array.from(new Uint8Array(buf))
      .map(b=>b.toString(16).padStart(2,'0')).join('');
  }catch(e){
    let h=0;
    for(let i=0;i<clean.length;i++)
      h=((h<<5)-h)+clean.charCodeAt(i)|0;
    return 'fallback_'+h;
  }
}

const stripNum=n=>String(n||"").replace(/^\d+[\.\)\-\s]+/,'').trim();
const M=["ม.ค.","ก.พ.","มี.ค.","เม.ย.","พ.ค.",
  "มิ.ย.","ก.ค.","ส.ค.","ก.ย.","ต.ค.","พ.ย.","ธ.ค."];
const MF=["มกราคม","กุมภาพันธ์","มีนาคม",
  "เมษายน","พฤษภาคม","มิถุนายน","กรกฎาคม",
  "สิงหาคม","กันยายน","ตุลาคม","พฤศจิกายน","ธันวาคม"];

function getDeviceType(){
  let u=navigator.userAgent||"";
  if(/iPhone/i.test(u))return"📱 iPhone";
  if(/iPad/i.test(u))return"📱 iPad";
  if(/Android/i.test(u)){
    let m=u.match(/Android\s[\d.]+;\s([^;)]+)/);
    let md=m?m[1].replace(/Build\/.*/,'').trim():"";
    return"📱 Android"+(md?` (${md})`:"");
  }
  if(/Windows/i.test(u))return"💻 Windows";
  if(/Mac/i.test(u))return"💻 Mac";
  return"🖥️ อุปกรณ์อื่น";
}
function ensureDeviceName(){
  let dn=(DEVICES[DEV_ID]?.name)||ls.getItem('rbDevName')||"";
  while(!dn.trim()){
    let inp=prompt("📱 ใส่ชื่อเล่นตัวเอง");
    if(inp!==null&&inp.trim())dn=inp.trim();
    else alert("⚠️ ต้องตั้งชื่อเล่นก่อนเข้าใช้งานครับ");
  }
  ls.setItem('rbDevName',dn);
  DEVICES[DEV_ID]={name:dn,type:getDeviceType(),last:Date.now()};
  ls.setItem('rbDevices',JSON.stringify(DEVICES));
}
function getDeviceLabel(){
  let dn=(DEVICES[DEV_ID]?.name)||ls.getItem('rbDevName')||"";
  let dt=getDeviceType();
  return dn?`${dt} [${dn}]`:dt;
}
function renderDeviceList(){
  if(!$('devListBox'))return;
  let keys=Object.keys(DEVICES);
  if(!keys.length){
    $('devListBox').innerHTML=
      `<p style="font-size:13px;color:#78909c">ยังไม่มีข้อมูลอุปกรณ์</p>`;
    return;
  }
  $('devListBox').innerHTML=keys.map(k=>{
    let d=DEVICES[k];
    let isMe=k===DEV_ID?' (เครื่องนี้)':'';
    return`<div style="border:1px solid #cfd8dc;padding:8px;border-radius:6px;margin-bottom:6px;background:#fafafa">`
      +`<div style="font-size:12px;color:#37474f;margin-bottom:4px"><b>${d.type}</b>`
      +`<span style="color:#2e7d32;font-weight:bold">${isMe}</span></div>`
      +`<div style="display:flex;gap:6px">`
      +`<input type="text" id="dvinp_${k}" value="${d.name||''}" style="font-size:15px;padding:6px 8px">`
      +`<button type="button" class="bg" style="width:auto;margin:0;padding:6px 10px;font-size:13px;white-space:nowrap" `
      +`onclick="adminRenameDev('${k}')">💾 บันทึก</button></div></div>`;
  }).join('');
}
function adminRenameDev(k){
  let el=$('dvinp_'+k);if(!el)return;
  let nm=String(el.value||"").trim();
  if(!nm)return alert("กรุณากรอกชื่อเล่นเครื่องครับ");
  let oldNm=DEVICES[k]?.name||"";
  if(oldNm===nm)return;
  DEVICES[k].name=nm;
  if(k===DEV_ID)ls.setItem('rbDevName',nm);
  ls.setItem('rbDevices',JSON.stringify(DEVICES));
  addActLog(`📱 แอดมินเปลี่ยนชื่ออุปกรณ์ "${oldNm}" ➔ "${nm}"`);
  saveAllData();renderDeviceList();
  alert("เปลี่ยนชื่อเรียบร้อยครับ");
}
function addActLog(msg){
  let d=new Date();
  let tm=d.toLocaleDateString('th-TH',{day:'2-digit',month:'short',year:'2-digit'})
    +" "+d.toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'});
  ACT_LOGS.unshift({t:tm,dev:getDeviceLabel(),m:msg});
  if(ACT_LOGS.length>100)ACT_LOGS.length=100;
  ls.setItem('rbActLogs',JSON.stringify(ACT_LOGS));
  renderActLogs();
}
function renderActLogs(){
  if(!$('actLogBox'))return;
  $('actLogBox').innerHTML=ACT_LOGS.length?
    ACT_LOGS.map(x=>`<div class="log-item"><span class="log-time">🕒 ${x.t}`
      +`${x.dev?` • <b>${x.dev}</b>`:''}</span><span>${x.m}</span></div>`).join(''):
    `<p style="color:#78909c;text-align:center;margin:10px 0">ยังไม่มีประวัติการแก้ไข</p>`;
}
function clearActLogs(){
  if(!confirm("⚠️ ยืนยันการล้างประวัติการแก้ไข?"))return;
  ACT_LOGS=[];
  ls.setItem('rbActLogs','[]');
  ls.setItem('rbClearLogs','1');
  renderActLogs();
  saveAllData();
}
async function refreshActLogs(){
  if(!$('actLogBox'))return;
  $('actLogBox').innerHTML=`<p style="color:#1565c0;text-align:center;margin:10px 0">⏳ กำลังดึงข้อมูลล่าสุด...</p>`;
  await syncCloud(0);
  renderActLogs();renderDeviceList();
}
function getThaiToday(){
  let d=new Date(Date.now()+7*3600000);
  return d.toISOString().slice(0,10);
}

let pinTimer=null;
function updatePinLockUI(){
  let lockUntil=+(ls.getItem('rbPinLockUntil')||0);
  let now=Date.now();
  let el=$('pinInp'),btn=$('btnLogin'),err=$('pinErr'),admBtn=$('btnAdminUnlock');
  if(!el||!btn||!err)return false;
  if(lockUntil>now){
    let sec=Math.ceil((lockUntil-now)/1000);
    let h=Math.floor(sec/3600);
    let m=Math.floor((sec%3600)/60);
    let s=String(sec%60).padStart(2,'0');
    let timeText=h>0
      ?`${h} ชม. ${String(m).padStart(2,'0')} นาที ${s} วินาที`
      :`${m}:${s} นาที`;
    el.disabled=true;btn.disabled=true;
    if(admBtn)admBtn.classList.remove('hide');
    err.innerText=`⏳ กดรหัสผิดเกินกำหนด กรุณารออีก ${timeText}`;
    err.classList.remove('hide');
    if(!pinTimer){
      pinTimer=setInterval(()=>{
        if(!updatePinLockUI()){clearInterval(pinTimer);pinTimer=null;}
      },1000);
    }
    return true;
  }else{
    if(lockUntil>0){
      ls.removeItem('rbPinLockUntil');
      el.disabled=false;btn.disabled=false;
      err.classList.add('hide');
      if(admBtn)admBtn.classList.add('hide');
      el.focus();
    }
    return false;
  }
}
async function adminUnlockPin(){
  let pwd=prompt("🔐 ใส่รหัสผ่านแอดมิน (Admin PIN) เพื่อปลดล็อก:");
  if(pwd===null)return;
  let h=await hashPin(pwd);
  if(h===ADMIN_HASH||h===DEF_ADM_HASH){
    ls.removeItem('rbPinFails');
    ls.removeItem('rbPinLockUntil');
    if(pinTimer){clearInterval(pinTimer);pinTimer=null;}
    $('pinInp').disabled=false;$('btnLogin').disabled=false;
    $('pinErr').classList.add('hide');
    $('btnAdminUnlock').classList.add('hide');
    alert("✅ ปลดล็อกเรียบร้อยแล้ว สามารถกรอกรหัสเข้าใช้งานได้ทันทีครับ");
    $('pinInp').focus();
  }else alert("❌ รหัสผ่านแอดมินไม่ถูกต้องครับ");
}
async function checkPin(){
  if(updatePinLockUI())return;
  let el=$('pinInp'),err=$('pinErr'),btn=$('btnLogin');
  let raw=normPin(el?el.value:"");
  if(!raw)return;
  if(err)err.classList.add('hide');
  if(btn){btn.disabled=true;btn.innerText="⏳ กำลังตรวจสอบ...";}

  let cloudApp="",cloudAdm="";
  try{
    let res=await fetch(FB_URL);
    if(res.ok){
      let d=await res.json();
      if(d&&(d.appHash||d.appPin)){
        cloudApp=d.appHash?String(d.appHash).toLowerCase():await hashPin(d.appPin);
        APP_HASH=cloudApp;ls.setItem('rbAppHash',APP_HASH);
      }
      if(d&&(d.adminHash||d.adminPin)){
        cloudAdm=d.adminHash?String(d.adminHash).toLowerCase():await hashPin(d.adminPin);
        ADMIN_HASH=cloudAdm;ls.setItem('rbAdmHash',ADMIN_HASH);
      }
    }
  }catch(e){}

  if(btn){btn.disabled=false;btn.innerText="🔓 เข้าใช้งาน";}
  let h=await hashPin(raw);
  let valid=(h===APP_HASH||h===ADMIN_HASH||h===DEF_APP_HASH||h===DEF_ADM_HASH
    ||(cloudApp&&h===cloudApp)||(cloudAdm&&h===cloudAdm));

  if(valid){
    ls.removeItem('rbPinFails');ls.removeItem('rbPinLockUntil');
    ensureDeviceName();
    ls.setItem('rbAuthHash',APP_HASH);
    ls.removeItem('rbAuth');ls.removeItem('rbCustomPin');ls.removeItem('rbAdminPin');
    if(err)err.classList.add('hide');
    $('loginBox').classList.add('hide');
    $('appMain').classList.remove('hide');
    init();
    await syncCloud(0);
    if(ls.getItem('rbDirty')==='1')syncCloud(1);
  }else{
    let fails=+(ls.getItem('rbPinFails')||0)+1;
    ls.setItem('rbPinFails',fails);
    if(el)el.value="";
    let waitMin=0;
    if(fails===3)waitMin=5;
    else if(fails===4)waitMin=15;
    else if(fails===5)waitMin=60;
    else if(fails===6)waitMin=360;
    else if(fails>=7)waitMin=1440;

    if(waitMin>0){
      ls.setItem('rbPinLockUntil',Date.now()+waitMin*60000);
      updatePinLockUI();
    }else{
      let rem=3-fails;
      if(err){
        err.innerText=`❌ รหัสผ่านไม่ถูกต้อง (เหลือโอกาสอีก ${rem} ครั้ง)`;
        err.classList.remove('hide');
      }
      if(el)el.focus();
    }
  }
}

function renderDaily(){

  $('dailyDetail').innerHTML="";

    let d=new Date(x.d);

      if(!dm.has(x.d))dm.set(x.d,{d:x.d,wids:new Set(),w:0,t:0});
      let r=dm.get(x.d);r.wids.add(x.wid);r.w+=x.w;r.t+=x.t;tw+=x.w;tt+=x.t;
    }
  });
  let days=[...dm.values()].sort((a,b)=>b.d.localeCompare(a.d));
  $('dailySum').innerHTML=days.length?
    `<p style="font-size:14px;color:#555;margin:6px 0">* แตะที่วันที่เพื่อดูรายชื่อคนงานที่มาขาย</p>`
    +`<table><tr><th>วันที่ขาย</th><th>คนงาน</th><th>น้ำหนักรวม (กก.)</th><th>ยอดขายก่อนหัก</th></tr>`

      +`<td style="text-align:center;color:#1565c0;text-decoration:underline"><b>${fmtThaiDate(r.d,true)}</b></td>`

      +`<td>${r.w.toLocaleString()}</td><td><b>${r.t.toLocaleString()}</b></td></tr>`).join('')

function renderSlipList(){
  let W=getW(),H=getH(),d=$('prDateSel').value;
  curSlipItems=[];
  if(!d){$('slipChkList').innerHTML="";$('slipPreview').innerHTML="";return;}
  H.forEach((x,idx)=>{
    if(x.d===d){
      let w=W.find(w=>w.id===x.wid),yr=d.slice(0,4);
      let cumSav=H.filter((h,hi)=>h.wid===x.wid&&h.d.startsWith(yr)&&(h.d<d||(h.d===d&&hi<=idx))).reduce((a,b)=>a+b.s,0);
      curSlipItems.push({...x,idx,name:w?w.n:(stripNum(x.wn)||`คนงาน ${x.wid}`),cumSav});
    }
  });
  $('slipChkList').innerHTML=`<label class="chk-row" style="background:#e8f5e9;border-color:#2e7d32"><input type="checkbox" id="schkSum" checked onchange="renderSlipPreview()"><span><b>📊 สรุปยอดขาย</b></span></label>`
    +curSlipItems.map((it,i)=>`<label class="chk-row"><input type="checkbox" id="schk${i}" checked onchange="renderSlipPreview()"><span><b>${it.name}</b> — ${it.w.toLocaleString()} กก. (${fmt2(it.p)} บ.)</span></label>`).join('');
  renderSlipPreview();
}

}
async function doRestore(){
  try{
    let d=JSON.parse($('bkBox').value);
    if(!confirm(
      "⚠️ เขียนทับข้อมูลทั้งหมด ยืนยัน?"))
      return;
    if(d.appVer){
      APP_VER=d.appVer;
      ls.setItem('rbAppVer',APP_VER);
    }
    if(d.appHash||d.appPin){
      APP_HASH=d.appHash?
        String(d.appHash).toLowerCase():
        await hashPin(d.appPin);
      ls.setItem('rbAppHash',APP_HASH);
      ls.setItem('rbAuthHash',APP_HASH);
      ls.removeItem('rbCustomPin');
      ls.removeItem('rbAuth');
    }
    if(d.adminHash||d.adminPin){
      ADMIN_HASH=d.adminHash?
        String(d.adminHash).toLowerCase():
        await hashPin(d.adminPin);
      ls.setItem('rbAdmHash',ADMIN_HASH);
      ls.removeItem('rbAdminPin');
    }
    if(d.devices&&
      typeof d.devices==='object'){
      DEVICES=d.devices;
      ls.setItem('rbDevices',
        JSON.stringify(DEVICES));
    }
    if(Array.isArray(d.actLogs)){
      ACT_LOGS=d.actLogs;
      ls.setItem('rbActLogs',
        JSON.stringify(ACT_LOGS));
    }
    if(Array.isArray(d.plots)
      &&d.plots.length){
      PLOTS=normPlots(d.plots);
      curPlotId=PLOTS.at(0).id;
    }else if(d.W&&d.H){
      PLOTS=normPlots([{
        id:'plot_1',
        name:'แปลงที่ 1',
        W:d.W,
        H:d.H.map(x=>({
          ...x,
          wid:x.wid||
            (d.W[x.wi]?
              d.W[x.wi].id:1)
        }))
      }]);
      curPlotId='plot_1';
    }else throw 0;
    ['rbDirty','rbDelRids','rbEditRids',
     'rbNewPids','rbDelPids']
      .forEach(k=>ls.removeItem(k));
    ls.setItem('rbPlotsV1',
      JSON.stringify(PLOTS));
    ls.setItem('rbCurPlotId',curPlotId);
    addActLog(`📥 กู้คืนข้อมูลทั้งระบบ`);
    let curP=getCurPlot();
    await fetch(FB_URL,{
      method:'PUT',
      headers:{
        'Content-Type':
        'application/json'
      },
      body:JSON.stringify({
        appVer:APP_VER,
        appHash:APP_HASH,
        adminHash:ADMIN_HASH,
        actLogs:ACT_LOGS,
        devices:DEVICES,
        plots:PLOTS,
        W:curP.W,H:curP.H
      })
    });
    init();renderWList();
    fillPersonDropdown();
    closeAdminPanel();
    alert("กู้คืนข้อมูลสำเร็จ!");
    tab(1);
  }catch(e){
    alert(
      "รหัสข้อมูลสำรองไม่ถูกต้องครับ");
  }
}
if(ls.getItem('rbAuthHash')===APP_HASH){
  ensureDeviceName();
  $('loginBox').classList.add('hide');
  $('appMain').classList.remove('hide');
  init();syncCloud(0);
}else{
  updatePinLockUI();
}
</script>
